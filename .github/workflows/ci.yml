name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-secret-only-for-tests-0123456789abcdef
  EMAIL_PROVIDER: smtp
  SMTP_HOST: localhost
  SMTP_PORT: "1025"

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aprovaai
          POSTGRES_PASSWORD: aprovaai
          POSTGRES_DB: aprovaai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aprovaai" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://aprovaai:aprovaai@localhost:5432/aprovaai
      DATABASE_URL_TEST: postgres://aprovaai:aprovaai@localhost:5432/aprovaai_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aprovaai
          POSTGRES_PASSWORD: aprovaai
          POSTGRES_DB: aprovaai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aprovaai" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://aprovaai:aprovaai@localhost:5432/aprovaai
      MAILPIT_URL: http://localhost:8025
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm --filter @aprovaai/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
